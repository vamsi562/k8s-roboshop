---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    purpose: roboshop
    component: mongodb
    tier: db
  namespace: roboshop
spec:
  # Specify replicas to be created
  replicas: 1
  selector:
    matchLabels:
      purpose: roboshop
      component: mongodb
      tier: db
  template:
    # pod definition
    metadata:
      labels:
        purpose: roboshop
        component: mongodb
        tier: db
    spec:
      containers:
        - name: mongodb
          image: vamsi562/mongodb:v1
          imagePullPolicy: Always
          readinessProbe: # check if application is ready to serve requests
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe: # check if application is alive or not.
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
spec:
  selector:
    purpose: roboshop
    component: mongodb
    tier: db
  ports:
    - protocol: TCP
      port: 27017 #servicePort
      targetPort: 27017 #containerPort
