---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
  labels:
    purpose: roboshop
    component: cart
    tier: backend
  data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    purpose: roboshop
    component: cart
    tier: backend
  namespace: roboshop
spec:
  # Specify replicas to be created
  replicas: 1
  selector:
    matchLabels:
      purpose: roboshop
      component: cart
      tier: backend
  template:
    # pod definition
    metadata:
      labels:
        purpose: roboshop
        component: cart
        tier: backend
    spec:
      containers:
        - name: cart
          image: vamsi562/cart:v1
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: cart
          ports:
        - name: liveness-port
          containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: liveness-port
            failureThreshold: 1
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: liveness-port
            failureThreshold: 1
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: roboshop
spec:
  selector:
    purpose: roboshop
    component: cart
    tier: backend
  ports:
    - protocol: TCP
      port: 8080 #servicePort
      targetPort: 8080 #containerPort
